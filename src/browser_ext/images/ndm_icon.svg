<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0050a0"/>
      <stop offset="100%" stop-color="#0096ff"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8e4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Download arrow shaft -->
  <rect x="56" y="20" width="16" height="52" rx="8" fill="url(#arrowGrad)"/>

  <!-- Arrow head -->
  <polygon points="30,70 64,106 98,70" fill="url(#arrowGrad)"/>

  <!-- Base bar -->
  <rect x="22" y="108" width="84" height="12" rx="6" fill="rgba(255,255,255,0.9)"/>

  <!-- Speed lines (left) -->
  <rect x="16" y="52" width="28" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="20" y="64" width="20" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Speed lines (right) -->
  <rect x="84" y="52" width="28" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="88" y="64" width="20" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
</svg>
